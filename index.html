<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>성탄절 서울 데이트</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: full-bleed toy-town 3D map; a cozy bottom sheet holds the stops, controls and the add form */
:root{
  --night:#1b2346;
  --sheet:#fff8ec;
  --ink:#3b2a1e;
  --muted:#8a7464;
  --rule:rgba(59,42,30,.12);
  --chip:#f3e6d2;
  --holly:#e05a4f;
  --pine:#4fa37a;
  --gold:#f2b544;
  --sky:#7fc8f0;
  --l1:#0052a4;--l3:#ef7c1c;--sub:#7c5cc4;--ktx:#3c6fd1;
  --f-display:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sheet:#2a2238;--ink:#fbf1e2;--muted:#c4b4a6;--rule:rgba(251,241,226,.14);--chip:#3a3049;color-scheme:dark}}
:root[data-theme="dark"]{--sheet:#2a2238;--ink:#fbf1e2;--muted:#c4b4a6;--rule:rgba(251,241,226,.14);--chip:#3a3049;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--night);color:var(--ink);font-family:var(--f-body);font-size:14px;overflow:hidden;-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
[hidden]{display:none!important}
#stage{position:fixed;left:0;right:0;top:0;height:60%;overflow:hidden;background:var(--sky)}
#stage canvas{display:block;touch-action:none}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;white-space:nowrap;font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;
  background:rgba(255,248,236,.92);color:#3b2a1e;box-shadow:0 2px 6px rgba(40,30,20,.18);will-change:transform}
.lbl.stop{background:var(--gold);color:#3b2410;font-family:var(--f-display);font-weight:400;font-size:13px;padding:4px 10px}
.lbl.deco{opacity:.75;font-weight:500}
#bubble{position:absolute;left:0;top:0;pointer-events:none;font-family:var(--f-display);font-size:15px;background:#fffdf6;color:#3a2410;
  padding:7px 13px;border-radius:16px;white-space:nowrap;box-shadow:0 4px 14px rgba(40,30,20,.25);opacity:0;transition:opacity .25s}
#bubble::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:#fffdf6}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#pickHint{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:var(--ink);color:var(--sheet);border-radius:999px;
  padding:8px 8px 8px 16px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:13px;white-space:nowrap;box-shadow:0 6px 18px rgba(0,0,0,.3)}
#pickHint button{border:0;border-radius:999px;padding:6px 12px;font:inherit;background:var(--sheet);color:var(--ink);cursor:pointer}

.top{position:fixed;top:0;left:0;right:0;z-index:5;pointer-events:none;padding-top:calc(env(safe-area-inset-top,0px) + 12px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.pill{background:rgba(255,248,236,.94);color:#3b2a1e;border-radius:18px;box-shadow:0 4px 14px rgba(40,30,20,.18)}
.brand{padding:8px 12px;min-width:0}
.brand h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:19px;line-height:1.15}
.brand h1 b{color:var(--holly);font-weight:400}
.sync{display:inline-flex;align-items:center;gap:5px;margin-top:3px;font-size:11px;font-weight:600;color:#7a6556}
.sync i{width:8px;height:8px;border-radius:50%;background:#b9a99a;display:inline-block}
.sync.live i{background:#3fb47a;box-shadow:0 0 0 3px rgba(63,180,122,.25)}
.sync.err i{background:var(--holly)}
.clock{padding:6px 12px 8px;text-align:right;flex:0 0 auto}
.clock .t{font-family:var(--f-display);font-size:28px;line-height:1;font-variant-numeric:tabular-nums;color:#c9821a}
.mode{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;margin-top:4px;font-size:11px;font-weight:600}
.mode i{width:9px;height:9px;border-radius:50%;background:var(--pine);display:inline-block}

#sheet{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--sheet);color:var(--ink);border-radius:24px 24px 0 0;
  padding-top:12px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 12px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:10px;box-shadow:0 -10px 30px rgba(20,15,40,.25)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -4px;padding:2px 4px 4px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:0;background:var(--chip);color:var(--muted);border-radius:14px;padding:6px 11px;font:inherit;font-size:12px;
  text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:1px}
.chip .n{font-family:var(--f-display);font-size:13.5px;color:var(--ink)}
.chip .h{font-variant-numeric:tabular-nums;font-size:10.5px}
.chip.on{background:var(--holly);color:#fff}.chip.on .n{color:#fff}
.chip.done{opacity:.55}
.chip.add{background:transparent;border:1.5px dashed var(--rule);justify-content:center;align-items:center;color:var(--ink);font-family:var(--f-display);font-size:14px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.card{display:flex;flex-direction:column;gap:5px;min-width:0}
.card .when{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;font-variant-numeric:tabular-nums;color:#c9821a;font-weight:600}
.card h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:22px;line-height:1.2;text-wrap:balance}
.card p{margin:0;font-size:13.5px;line-height:1.55;max-width:65ch}
.route{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:9px;background:var(--chip)}
.tag i{width:8px;height:8px;border-radius:50%;display:inline-block}
.tip{font-size:12px;color:var(--muted);line-height:1.5}
.del{border:0;background:none;color:var(--muted);font:inherit;font-size:11.5px;text-decoration:underline;cursor:pointer;padding:2px}
.del.arm{color:var(--holly);font-weight:600}
.bar{height:4px;border-radius:2px;background:var(--chip);overflow:hidden}
.bar span{display:block;height:100%;width:0;background:var(--gold)}
.ctrls{display:flex;gap:8px;align-items:center}
.btn{border:0;background:var(--chip);color:var(--ink);border-radius:14px;height:44px;min-width:44px;padding:0 12px;font:inherit;font-size:13px;font-weight:600;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}
.btn svg{width:16px;height:16px;fill:currentColor}
.btn.play{flex:1;background:var(--holly);color:#fff;font-family:var(--f-display);font-size:16px;font-weight:400;box-shadow:0 3px 0 #b8433a}
.btn.on{background:var(--gold);color:#3b2410}

#modal{position:fixed;inset:0;z-index:20;background:rgba(20,15,35,.45);display:flex;align-items:flex-end;justify-content:center}
#addForm{background:var(--sheet);color:var(--ink);width:100%;max-width:480px;border-radius:24px 24px 0 0;max-height:92%;overflow:auto;
  padding-top:18px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px);
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}
#addForm h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:22px}
#addForm .sub{margin:-6px 0 0;font-size:12.5px;color:var(--muted)}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f label{font-size:12px;font-weight:600;color:var(--muted)}
.f input,.f select,.f textarea{font:inherit;font-size:15px;color:var(--ink);background:var(--chip);border:1.5px solid transparent;border-radius:12px;padding:10px 12px;width:100%}
.f textarea{min-height:64px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{font-size:13px;font-weight:600;color:var(--ink);background:var(--chip);padding:8px 12px;border-radius:999px;cursor:pointer;border:1.5px solid transparent}
.seg input:checked+label{background:var(--gold);color:#3b2410}
.seg input:focus-visible+label{border-color:var(--ink)}
.pickrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pickrow span{font-size:12.5px;color:var(--muted)}
.formerr{color:var(--holly);font-size:12.5px;font-weight:600;min-height:1em}
#err{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:#3b2a1e;font-size:14px}
@media (min-width:760px){
  #sheet{left:auto;right:16px;bottom:16px;width:390px;border-radius:24px}
  #modal{align-items:center}#addForm{border-radius:24px}
}
</style>
</head>
<body>
<div id="stage"><div id="labels"></div><div id="bubble"></div><div id="flash"></div>
  <div id="pickHint" hidden>지도를 탭해서 위치를 고르세요 <button type="button" id="pickCancel">취소</button></div></div>

<div class="top">
  <div class="pill brand">
    <h1>크리스마스 <b>서울</b> 데이트</h1>
    <div class="sync" id="sync"><i></i><span>불러오는 중</span></div>
  </div>
  <div class="pill clock">
    <div class="t" id="clock">11:30</div>
    <div class="mode"><i id="modeDot"></i><span id="modeTxt">서울역 도착</span></div>
  </div>
</div>

<section id="sheet" aria-label="일정">
  <div class="chips" id="chips" role="tablist"></div>
  <div class="card">
    <div class="when"><span id="when"></span><button type="button" class="del" id="del">이 일정 삭제</button></div>
    <h2 id="title"></h2>
    <p id="body"></p>
    <div class="route" id="route"></div>
    <div class="tip" id="tip"></div>
  </div>
  <div class="bar"><span id="prog"></span></div>
  <div class="ctrls">
    <button class="btn" id="prev" aria-label="이전 일정"><svg viewBox="0 0 24 24"><path d="M15.5 4 7 12l8.5 8 1.5-1.6L10.2 12 17 5.6z"/></svg></button>
    <button class="btn play" id="play">일시정지</button>
    <button class="btn" id="next" aria-label="다음 일정"><svg viewBox="0 0 24 24"><path d="M8.5 4 17 12l-8.5 8L7 18.4 13.8 12 7 5.6z"/></svg></button>
    <button class="btn" id="over">전체</button>
    <button class="btn" id="addBtn" aria-label="동선 추가"><svg viewBox="0 0 24 24"><path d="M11 4h2v7h7v2h-7v7h-2v-7H4v-2h7z"/></svg></button>
  </div>
</section>

<div id="modal" hidden>
  <form id="addForm" novalidate>
    <h3>동선 추가</h3>
    <p class="sub" id="addSub">시간 순서대로 일정 사이에 들어가요.</p>
    <div class="f"><label for="fTitle">장소 이름</label><input id="fTitle" maxlength="30" placeholder="예: 청계천 산책" required></div>
    <div class="two">
      <div class="f"><label for="fStart">도착</label><input id="fStart" type="time" required></div>
      <div class="f"><label for="fEnd">떠남</label><input id="fEnd" type="time" required></div>
    </div>
    <div class="f"><label for="fMemo">할 일 메모</label><textarea id="fMemo" maxlength="200" placeholder="예: 청계천 따라 걸으면서 루미나리에 구경"></textarea></div>
    <div class="f"><span style="font-size:12px;font-weight:600;color:var(--muted)">어떻게 가요?</span>
      <div class="seg" role="radiogroup" aria-label="이동 방법">
        <input type="radio" name="mode" id="m-walk" value="walk" checked><label for="m-walk">걸어서</label>
        <input type="radio" name="mode" id="m-sub" value="subway"><label for="m-sub">지하철</label>
      </div></div>
    <div class="f"><span style="font-size:12px;font-weight:600;color:var(--muted)">거기서 뭐 해요?</span>
      <div class="seg" role="radiogroup" aria-label="활동">
        <input type="radio" name="act" id="a-look" value="look" checked><label for="a-look">구경</label>
        <input type="radio" name="act" id="a-eat" value="eat"><label for="a-eat">먹기</label>
        <input type="radio" name="act" id="a-cafe" value="cafe"><label for="a-cafe">카페</label>
        <input type="radio" name="act" id="a-photo" value="photo"><label for="a-photo">사진</label>
      </div></div>
    <div class="f"><span style="font-size:12px;font-weight:600;color:var(--muted)">위치</span>
      <div class="pickrow"><button type="button" class="btn" id="pickBtn">지도에서 고르기</button><span id="pickInfo">안 고르면 앞뒤 일정 사이에 놓여요</span></div></div>
    <div class="formerr" id="formErr" role="alert"></div>
    <div class="ctrls"><button type="button" class="btn" id="cancelAdd">취소</button><button type="submit" class="btn play" id="saveAdd">추가하기</button></div>
  </form>
</div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/geometries/RoundedBoxGeometry.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function(){
const $=s=>document.querySelector(s);
const stage=$('#stage'),sheet=$('#sheet');
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const CFG=window.APP_CONFIG||{};const TRIP=CFG.TRIP_ID||'xmas-2026';

/* ================= default itinerary (seeded into Supabase on first run) ================= */
const SEED=[
 {start_time:'11:30',end_time:'11:38',title:'서울역 도착',memo:'기차에서 내려 서울역으로. 크리스마스 데이트 시작!',tip:'',say:'메리 크리스마스!',mode:'ktx',act:'arrive',x:-54,z:95,
  route:[{m:'ktx',pts:[[-64,300],[-62,210],[-58,150],[-58,97]]},{m:'walk',pts:[]}]},
 {start_time:'12:05',end_time:'13:00',title:'안국역 근처 점심',memo:'서울역에서 1호선을 타고 종로3가역에서 3호선으로 갈아탄 뒤 안국역에서 내려요. 안국역 근처에서 점심.',tip:'1호선 3정거장 + 3호선 1정거장, 환승 포함 20분 안팎.',say:'따끈한 점심 🍲',mode:'subway1',act:'eat',x:31,z:-43,
  route:[{m:'walk',pts:[[-48,93],[-42,90],[-41,86]]},{m:'subway1',pts:[[-36,70],[-22,45],[-14,24],[-6,8],[14,0],[53,-2]]},{m:'subway3',pts:[[50,-20],[40,-33],[24,-36]]},{m:'walk',pts:[[28,-39]]}]},
 {start_time:'13:20',end_time:'13:35',title:'북촌 한옥 골목',memo:'사진 찍으면서 천천히 한 바퀴. 눈 쌓인 기와지붕 골목을 걸어요.',tip:'주민이 사는 동네라 조용히. 북촌 일부 구역은 관광 가능 시간이 오후 5시까지라 이른 오후가 좋아요.',say:'한옥 골목 찰칵 📸',mode:'walk',act:'photo',x:22,z:-62,
  route:[{m:'walk',pts:[[25,-42],[23,-52]]}]},
 {start_time:'14:05',end_time:'14:15',title:'기와지붕 언덕길',memo:'골목 위쪽 언덕에서 기와지붕이 겹겹이 보이는 자리.',tip:'',say:'눈 쌓인 기와!',mode:'walk',act:'photo',x:26,z:-84,
  route:[{m:'walk',pts:[[18,-70],[13,-80],[18,-88]]}]},
 {start_time:'14:45',end_time:'16:00',title:'삼청동 카페',memo:'다리 쉬면서 따뜻한 음료 한 잔. 추우면 국립현대미술관 서울에서 전시 한 편.',tip:'미술관은 카페에서 걸어서 5분 남짓이에요.',say:'따뜻한 라떼 ☕',mode:'walk',act:'cafe',x:5,z:-74,
  route:[{m:'walk',pts:[[28,-74],[22,-68],[14,-72]]}]},
 {start_time:'16:25',end_time:'17:15',title:'광화문 이른 저녁',memo:'경복궁 돌담 옆 삼청로를 따라 광화문 쪽으로 내려와서 이른 저녁.',tip:'12월 서울 해 지는 시각이 5시 20분 전후라 내려오는 길에 노을이 져요.',say:'이른 저녁 🍜',mode:'walk',act:'eat',x:1,z:-24,
  route:[{m:'walk',pts:[[2,-70],[2,-38]]}]},
 {start_time:'17:40',end_time:'18:00',title:'광화문광장 트리',memo:'광화문 마켓 구경 시작. 트리 앞에서 사진부터.',tip:'트리 사진은 불 들어온 직후가 덜 붐벼요.',say:'트리 앞에서 찰칵 🎄',mode:'walk',act:'photo',x:-14,z:-13,
  route:[{m:'walk',pts:[[-8,-22],[-12,-16]]}]},
 {start_time:'18:30',end_time:'19:30',title:'광화문 마켓 부스',memo:'부스 돌면서 간식 먹기. 불 켜진 광장을 천천히.',tip:'',say:'간식 냠냠 🍢',mode:'walk',act:'eat',x:-14,z:13,
  route:[{m:'walk',pts:[[-10,-9],[-10,-2],[-14,1]]}]},
 {start_time:'20:00',end_time:'20:30',title:'서울역 승강장',memo:'광화문광장에서 시청역까지 걸어가 1호선으로 서울역. 역 안에서 승강장 찾아가는 시간까지 포함한 여유 시간.',tip:'시청역에서 서울역은 1호선 한 정거장.',say:'승강장 미리 확인!',mode:'subway1',act:'wait',x:-52,z:94,
  route:[{m:'walk',pts:[[-14,24]]},{m:'subway1',pts:[[-22,45],[-36,70],[-41,84]]},{m:'walk',pts:[[-42,90],[-48,93]]}]},
 {start_time:'20:40',end_time:'21:00',title:'대전행 열차',memo:'열차는 20시 30분~21시대 출발로 예매 추천. 일정에 맞춘 제안이고, 실제 열차는 예매 화면에서 확인.',tip:'지도 속 출발 장면은 예시예요.',say:'대전으로 출발! 🚄',mode:'walk',act:'depart',x:-56,z:97,
  route:[{m:'walk',pts:[]}]}
];
const KTX_OUT_TAIL=[[-58,150],[-62,210],[-64,300]];

const V=(x,z,y=0)=>new THREE.Vector3(x,y,z);
function poly(pts){const P=pts.map(p=>V(p[0],p[1]));const L=[0];for(let i=1;i<P.length;i++)L.push(L[i-1]+P[i].distanceTo(P[i-1]));return {P,L,len:L[L.length-1]};}
function sample(path,t){
  const P=path.P;if(P.length===1||path.len===0)return {pos:P[P.length-1].clone(),dir:null};
  const d=Math.min(Math.max(t,0),1)*path.len;let i=0;while(i<P.length-2&&path.L[i+1]<d)i++;
  const seg=path.L[i+1]-path.L[i]||1,f=(d-path.L[i])/seg;
  return {pos:P[i].clone().lerp(P[i+1],f),dir:P[i+1].clone().sub(P[i]).normalize()};
}
function segDist(px,pz,a,b){const dx=b[0]-a[0],dz=b[1]-a[1];const l=dx*dx+dz*dz||1;let t=((px-a[0])*dx+(pz-a[1])*dz)/l;t=Math.max(0,Math.min(1,t));return Math.hypot(px-a[0]-t*dx,pz-a[1]-t*dz);}
function polyDist(px,pz,pts){let m=1e9;for(let i=0;i<pts.length-1;i++)m=Math.min(m,segDist(px,pz,pts[i],pts[i+1]));return m}

function buildSteps(rows){
  return rows.map((r,i)=>{
    const prev=rows[i-1];
    const route=Array.isArray(r.route)&&r.route.length?r.route:[{m:r.mode||'walk',pts:[]}];
    let cur=prev?[prev.x,prev.z]:null;const legs=[];
    route.forEach((lg,li)=>{
      const pts=(cur?[cur]:[]).concat(lg.pts||[]);if(li===route.length-1)pts.push([r.x,r.z]);
      const m=MODE[lg.m]?lg.m:'walk';
      if(pts.length>=2){const p=poly(pts);if(p.len>.01)legs.push({m,pts,path:p,say:TRAVEL_SAY[m]||''});}
      if(pts.length)cur=pts[pts.length-1];
    });
    if(i===0&&legs.length&&r.say){legs[legs.length-1].say=r.say;}
    const tEnd=tm(r.start_time);let tStart=prev?tm(prev.end_time):tEnd-4;if(tStart>tEnd)tStart=tEnd;
    legs.forEach(l=>{l.dur=l.m==='walk'?Math.max(1.4,l.path.len/6):l.m==='ktx'?3.4:1.2+l.path.len/26;});
    const tot=legs.reduce((a,l)=>a+l.path.len,0)||1;let acc=tStart;
    legs.forEach(l=>{l.t0=acc;acc+=(tEnd-tStart)*(l.path.len/tot);l.t1=acc;});
    let stay;
    if(r.act==='depart'){const pts=[[r.x,r.z]].concat(KTX_OUT_TAIL);stay={m:'ktx',act:'depart',pts,path:poly(pts),dur:3.6};}
    else stay={m:'stay',act:r.act,pts:[[r.x,r.z]],path:poly([[r.x,r.z]]),dur:(r.act==='eat'||r.act==='cafe')?3.2:2.6};
    stay.t0=tm(r.start_time);stay.t1=Math.max(stay.t0,tm(r.end_time));stay.say=r.say||'';
    legs.push(stay);
    return {row:r,legs};
  });
}

function projectUV(g){
  const p=g.attributes.position,n=g.attributes.normal,uv=g.attributes.uv;
  for(let i=0;i<p.count;i++){const ax=Math.abs(n.getX(i)),ay=Math.abs(n.getY(i)),az=Math.abs(n.getZ(i));
    if(ay>ax&&ay>az){uv.setXY(i,.02,.02);continue}
    const y=p.getY(i);uv.setXY(i,(ax>az?p.getZ(i):p.getX(i))/6,y/6);}
  uv.needsUpdate=true;
}

    const hx=x+(rnd()-.5)*1.2,hz=z+(rnd()-.5),ry=rnd()<.3?Math.PI/2:0;

  $('#route').innerHTML=tags.join('');
  STEPS.forEach((_,i)=>{const c=$('#chip'+i);if(!c)return;c.classList.toggle('on',i===S.step);c.classList.toggle('done',i<S.step);c.setAttribute('aria-selected',i===S.step)});
  const c=$('#chip'+S.step);if(c)chips.scrollTo({left:c.offsetLeft-chips.clientWidth/2+c.clientWidth/2,behavior:reduced?'auto':'smooth'});
  stepDotMats.forEach((m,i)=>{m.opacity=i===S.step?1:.3;m.color.setHex(i===S.step?0xe05a4f:0xc07a80)});
  stopLbl.textContent=r.title;disarmDel();
}
const isEnd=()=>S.step===STEPS.length-1&&S.leg>=STEPS[S.step].legs.length-1&&S.t>=1;
function setPlay(p){S.playing=p;$('#play').textContent=p?'일시정지':(isEnd()?'처음부터':'재생');}
let lastMode=null,fly=null,facing=Math.PI;
function goStep(i,user){
  if(!STEPS.length)return;S.step=Math.max(0,Math.min(i,STEPS.length-1));S.leg=0;S.t=0;S.pause=0;lastMode=null;
  if(S.overview){S.overview=false;$('#over').classList.remove('on');}
  renderCard();if(user)setPlay(true);
}
$('#prev').onclick=()=>goStep(S.step-1,true);
$('#next').onclick=()=>goStep(S.step+1,true);
$('#play').onclick=()=>{if(!S.playing&&isEnd()){goStep(0,true);return}setPlay(!S.playing);};
$('#over').onclick=()=>{S.overview=!S.overview;$('#over').classList.toggle('on',S.overview);
  if(S.overview)camFly(V(-6,30),V(80,190,200));else{const m=STEPS[S.step].legs[S.leg].m;camFly(null,desiredOffset(m==='stay'?'walk':m));}};
let delTimer=0;
function disarmDel(){const b=$('#del');b.classList.remove('arm');b.textContent='이 일정 삭제';clearTimeout(delTimer);}
$('#del').onclick=async()=>{
  const b=$('#del');if(!b.classList.contains('arm')){b.classList.add('arm');b.textContent='한 번 더 누르면 삭제';delTimer=setTimeout(disarmDel,3000);return}
  disarmDel();const id=STEPS[S.step].row.id;b.textContent='삭제하는 중';
  try{await deleteRow(id);await refresh(S.step);}catch(e){setSync('err','삭제 실패: '+(e.message||'연결 확인'));disarmDel();}
};

/* ---------- add form ---------- */
const modal=$('#modal');let picked=null,picking=false;
function openAdd(){
  const cur=STEPS[S.step]?.row,nx=STEPS[S.step+1]?.row;
  const a=cur?tm(cur.end_time):12*60,b=nx?tm(nx.start_time):a+60;
  const st=Math.min(a+10,b-10>a?b-10:a+5),en=Math.max(st+15,Math.min(st+40,b));
  $('#fStart').value=fmt(Math.max(0,st));$('#fEnd').value=fmt(Math.min(23*60+59,en));
  $('#fTitle').value='';$('#fMemo').value='';$('#formErr').textContent='';picked=null;pickPin.visible=false;
  $('#pickInfo').textContent='안 고르면 앞뒤 일정 사이에 놓여요';
  $('#addSub').textContent=cur?('"'+cur.title+'" 다음에 들어가요. 시간 순서대로 정렬돼요.'):'시간 순서대로 정렬돼요.';
  setPlay(false);modal.hidden=false;setTimeout(()=>$('#fTitle').focus(),50);
}
$('#addBtn').onclick=openAdd;
$('#cancelAdd').onclick=()=>{modal.hidden=true;pickPin.visible=false;};
modal.addEventListener('click',e=>{if(e.target===modal){modal.hidden=true;pickPin.visible=false;}});
$('#pickBtn').onclick=()=>{modal.hidden=true;picking=true;$('#pickHint').hidden=false;
  S.overview=true;$('#over').classList.add('on');const c=picked||[STEPS[S.step].row.x,STEPS[S.step].row.z];camFly(V(c[0],c[1]),V(30,95,95));};
$('#pickCancel').onclick=()=>{picking=false;$('#pickHint').hidden=true;modal.hidden=false;};
let downXY=null;
if(renderer){
  renderer.domElement.addEventListener('pointerdown',e=>{downXY=[e.clientX,e.clientY]});
  renderer.domElement.addEventListener('pointerup',e=>{
    if(!picking||!downXY||Math.hypot(e.clientX-downXY[0],e.clientY-downXY[1])>8)return;
    const r=renderer.domElement.getBoundingClientRect();const ndc=new THREE.Vector2((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);
    const ray=new THREE.Raycaster();ray.setFromCamera(ndc,camera);const hit=new THREE.Vector3();
    if(!ray.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0,1,0),0),hit))return;
    picked=[Math.round(hit.x*10)/10,Math.round(hit.z*10)/10];pickPin.position.set(picked[0],0,picked[1]);pickPin.visible=true;
    picking=false;$('#pickHint').hidden=true;$('#pickInfo').textContent='위치를 골랐어요 ✓';modal.hidden=false;
  });
}
$('#addForm').addEventListener('submit',async e=>{
  e.preventDefault();const err=$('#formErr');
  const title=$('#fTitle').value.trim(),st=$('#fStart').value,en=$('#fEnd').value;
  if(!title){err.textContent='장소 이름을 적어 주세요.';return}
  if(!st||!en){err.textContent='도착 시간과 떠나는 시간을 넣어 주세요.';return}
  if(en<st){err.textContent='떠나는 시간이 도착 시간보다 빨라요.';return}
  const mode=document.querySelector('input[name="mode"]:checked').value,act=document.querySelector('input[name="act"]:checked').value;
  let x,z;
  if(picked){[x,z]=picked;}else{const sorted=STEPS.map(s=>s.row);const before=sorted.filter(r=>r.start_time<=st).pop()||sorted[0];const after=sorted.find(r=>r.start_time>st)||before;
    x=(before.x+after.x)/2+3;z=(before.z+after.z)/2+3;}
  const say={eat:'냠냠 😋',cafe:'따뜻해 ☕',photo:'찰칵 📸',look:'우와~'}[act];
  const row={start_time:st,end_time:en,title,memo:$('#fMemo').value.trim(),tip:'',say,mode,act,x,z,route:null};
  $('#saveAdd').textContent='추가하는 중';$('#saveAdd').disabled=true;
  try{await addRow(row);modal.hidden=true;pickPin.visible=false;
    const rows=await refresh(null);const idx=rows.findIndex(r=>r.title===title&&r.start_time===st);goStep(idx<0?S.step:idx,true);}
  catch(e2){err.textContent='저장하지 못했어요. '+(e2.message||'연결을 확인해 주세요.');}
  $('#saveAdd').textContent='추가하기';$('#saveAdd').disabled=false;
});

/* ---------- data refresh ---------- */
let refreshing=null;
async function refresh(keepIdx){
  const curId=STEPS[S.step]?.row.id;
  const rows=await fetchRows();
  STEPS=buildSteps(rows);rebuildCity(STEPS);rebuildRoute(STEPS);renderChips();
  let idx=keepIdx;if(idx==null){idx=STEPS.findIndex(s=>s.row.id===curId);if(idx<0)idx=0;}
  idx=Math.max(0,Math.min(idx,STEPS.length-1));
  if(idx!==S.step||S.leg>=STEPS[idx].legs.length){S.step=idx;S.leg=0;S.t=0;lastMode=null;}
  renderCard();return rows;
}

/* ================= camera ================= */
camera.position.set(100,230,280);if(controls)controls.target.set(-6,0,40);
function camFly(target,offset){fly={t:0,fromT:controls.target.clone(),fromO:camera.position.clone().sub(controls.target),toT:target,toO:offset};}
function desiredOffset(mode){
  const far=mode.startsWith('subway')?62:mode==='ktx'?80:24;let cur;
  if(far<30){const a=facing+.75;cur=V(Math.sin(a),Math.cos(a));return cur.multiplyScalar(far*.75).setY(far*.62);}
  cur=camera.position.clone().sub(controls.target);cur.y=0;if(cur.lengthSq()<1)cur.set(0,0,1);cur.normalize();
  return cur.multiplyScalar(far*.8).setY(far*.62);
}

/* ================= animation ================= */
const clock=new THREE.Clock();let phase=0;const focus=V(-56,97);
const night=m=>{const a=17*60,b=18*60;const x=Math.min(1,Math.max(0,(m-a)/(b-a)));return x*x*(3-2*x)};
const dusk=m=>Math.max(0,1-Math.abs(m-17*60-10)/55);
const C=h=>new THREE.Color(h);
const SKY={dayT:C(0x63b6ee),dayB:C(0xdff3fc),duskT:C(0x7b86c9),duskB:C(0xffc49a),nightT:C(0x0b1236),nightB:C(0x2a3468)};
const tmpV=new THREE.Vector3(),tA=new THREE.Color(),tB=new THREE.Color();
function placeKids(pos,dir,walking,dt){
  {const target=dir?Math.atan2(dir.x,dir.z):Math.atan2(camera.position.x-pos.x,camera.position.z-pos.z);let d=target-facing;
   while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;facing+=d*Math.min(1,dt*(dir?8:3));}
  const fx=Math.sin(facing),fz=Math.cos(facing),lx=fz,lz=-fx,sep=1.08;
  boy.position.set(pos.x+lx*sep,0,pos.z+lz*sep);girl.position.set(pos.x-lx*sep,0,pos.z-lz*sep);boy.rotation.y=girl.rotation.y=facing;
  phase+=dt*(walking?9:2.2);
  [boy,girl].forEach((k,ki)=>{const u=k.userData;const sw=walking?Math.sin(phase+ki*.4)*.6:0;
    u.legs[0].rotation.x=sw;u.legs[1].rotation.x=-sw;const inner=ki===0?0:1,outer=1-inner;
    u.arms[inner].rotation.set(walking?sw*.15:0,0,ki===0?-.6:.6);u.arms[outer].rotation.set(walking?sw:Math.sin(phase)*.08,0,ki===0?.14:-.14);
    k.position.y=walking?Math.abs(Math.sin(phase+ki*.4))*.13:Math.max(0,Math.sin(phase*1.3+ki))*.07;
    u.head.rotation.z=walking?Math.sin(phase*.5+ki)*.05:(ki===0?-.12:.12);});
}
function tick(){
  requestAnimationFrame(tick);
  const dt=Math.min(clock.getDelta(),.05),tsec=clock.elapsedTime;
  if(!STEPS.length){renderer.render(scene,camera);return}
  const s=STEPS[S.step];let leg=s.legs[S.leg];
  if(S.playing&&!S.overview){
    if(S.pause>0){S.pause-=dt;if(S.pause<=0){if(S.step<STEPS.length-1)goStep(S.step+1,false);else setPlay(false);}}
    else{S.t+=dt/leg.dur;if(S.t>=1){if(S.leg<s.legs.length-1){S.leg++;S.t=0;}else{S.t=1;S.pause=S.step<STEPS.length-1?1.1:.01;}}}
    leg=STEPS[S.step].legs[S.leg];
  }
  const cs=STEPS[S.step];const t=Math.min(S.t,1);const mins=leg.t0+(leg.t1-leg.t0)*t;
  $('#clock').textContent=fmt(mins);
  const lp=cs.legs.reduce((a,l,i)=>a+(i<S.leg?l.dur:i===S.leg?l.dur*t:0),0)/cs.legs.reduce((a,l)=>a+l.dur,0);
  $('#prog').style.width=(lp*100).toFixed(1)+'%';
  $('#modeTxt').textContent=leg.m==='stay'?ACT[leg.act]:leg.act==='depart'?'열차 출발':(MODE[leg.m].t+(leg.m==='walk'?' 이동':''));
  $('#modeDot').style.background=leg.m==='stay'?'#f2b544':MODE[leg.m].c;

  const smp=sample(leg.path,leg.m==='stay'?0:t);
  const riding=leg.m!=='walk'&&leg.m!=='stay';
  Object.entries(vehicles).forEach(([k,v])=>{v.visible=riding&&leg.m===k});
  if(riding){const v=vehicles[leg.m];v.position.set(smp.pos.x,leg.m==='ktx'?.2:.4,smp.pos.z);if(smp.dir)v.rotation.y=Math.atan2(smp.dir.x,smp.dir.z);boy.visible=girl.visible=false;}
  else{boy.visible=girl.visible=true;placeKids(smp.pos,smp.dir,leg.m==='walk'&&S.playing&&!S.overview&&S.pause<=0,dt);}
  focus.lerp(smp.pos,1-Math.exp(-dt*6));
  tmpV.copy(camera.position).sub(focus).setY(0).normalize().multiplyScalar(5);coupleLight.position.set(focus.x+tmpV.x,5,focus.z+tmpV.z);

  if(leg.m==='stay'&&S.playing&&!S.overview){heartTimer-=dt;if(heartTimer<=0){spawnHeart(smp.pos);heartTimer=.9;}
    flash.style.opacity=leg.act==='photo'?(Math.max(0,1-Math.abs(t-.5)*14)*.8).toFixed(2):0;}else flash.style.opacity=0;
  hearts.forEach(h=>{if(!h.sp.visible)return;h.t+=dt;h.sp.position.y+=dt*1.4;h.sp.material.opacity=Math.max(0,1-h.t/1.6);if(h.t>1.6)h.sp.visible=false;});
  pins.forEach((p,i)=>{if(!p)return;const on=i===S.step;p.visible=!(on&&Math.hypot(focus.x-p.position.x,focus.z-p.position.z)<6);const sc=on?1:.6;p.scale.setScalar(p.scale.x+(sc-p.scale.x)*Math.min(1,dt*6));p.position.y=on?Math.sin(tsec*3)*.25:0;p.rotation.y+=dt*(on?1.5:0);});

  if(!S.overview){const m=riding?leg.m:'foot';if(lastMode!==m){if(!riding&&smp.dir)facing=Math.atan2(smp.dir.x,smp.dir.z);camFly(null,desiredOffset(riding?leg.m:'walk'));lastMode=m;}}
  if(fly){fly.t=Math.min(1,fly.t+dt/1.4);const e=fly.t<.5?2*fly.t*fly.t:1-Math.pow(-2*fly.t+2,2)/2;
    const nt=fly.fromT.clone().lerp(fly.toT||focus,e),no=fly.fromO.clone().lerp(fly.toO||fly.fromO,e);controls.target.copy(nt);camera.position.copy(nt).add(no);if(fly.t>=1)fly=null;}
  else if(!S.overview){tmpV.copy(focus).sub(controls.target);controls.target.add(tmpV);camera.position.add(tmpV);}
  controls.update();

  // light follows the camera target so shadows stay crisp where you look
  sun.target.position.copy(controls.target);sun.position.copy(controls.target).add(tmpV.set(-60,110,50));
  skyDome.position.copy(camera.position);
  const n=night(mins),dk=dusk(mins);
  tA.copy(SKY.dayT).lerp(SKY.duskT,dk*.8).lerp(SKY.nightT,n);tB.copy(SKY.dayB).lerp(SKY.duskB,dk*.9).lerp(SKY.nightB,n);
  skyU.top.value.copy(tA);skyU.bot.value.copy(tB);scene.fog.color.copy(tB);
  sun.intensity=.95*(1-n)+.08;sun.color.setHex(dk>.3?0xffbf94:0xfff1dc);
  hemi.intensity=.55-n*.2;hemi.color.setHex(n>.5?0x8a9ae0:0xfff6ea);hemi.groundColor.setHex(n>.5?0x2c3360:0xb7c4e0);
  coupleLight.intensity=n*2.6;
  nightMats.forEach(([m,k])=>m.emissiveIntensity=n*k);
  bulbMat.color.setHex(n>.3?0xffe39a:0xf3efe6);
  const blink=.5+.5*Math.sin(tsec*3);
  lights.material.opacity=.12+n*.88;orn1.material.opacity=(.2+n*.8)*blink;orn2.material.opacity=(.2+n*.8)*(1-blink);
  starMat.color.setHSL(.13,1,.6+.15*blink);stars.material.opacity=n*.9;stars.visible=n>.05;
  towerTop.material.color.setHSL(0,.9,.55+.2*blink);cloudMat.opacity=.96-n*.5;
  clouds.forEach((c,i)=>{c.position.x+=dt*(1+i%3*.4);if(c.position.x>200)c.position.x=-200;});

  const sp=snowG.attributes.position.array;
  for(let i=0;i<SN;i++){let y=sp[i*3+1]-dt*(3+(i%5));if(y<0)y+=70;sp[i*3+1]=y;sp[i*3]+=Math.sin(tsec+i)*dt*.4;}
  snowG.attributes.position.needsUpdate=true;snow.position.set(controls.target.x,0,controls.target.z);

  renderer.render(scene,camera);

  const place=(el,x,y,z,dy=0)=>{tmpV.set(x,y,z).project(camera);if(tmpV.z>1||Math.abs(tmpV.x)>1.1||Math.abs(tmpV.y)>1.1){el.style.display='none';return false}
    el.style.display='';el.style.transform='translate('+((tmpV.x+1)/2*W).toFixed(1)+'px,'+((1-tmpV.y)/2*H+dy).toFixed(1)+'px) translate(-50%,-100%)';return true;};
  LANDMARKS.forEach((l,i)=>place(lblEls[i],l[1],l[3],l[2]));
  const r=cs.row;if(r.act!=='depart')place(stopLbl,r.x,Math.hypot(focus.x-r.x,focus.z-r.z)<6?7.2:6.4,r.z);else stopLbl.style.display='none';
  if(leg.say&&!S.overview&&S.pause<=0&&t<.97){bubble.textContent=leg.say;bubble.style.opacity=1;place(bubble,focus.x,riding?4.8:4.9,focus.z,-6);}
  else bubble.style.opacity=0;
}

/* ================= boot ================= */
(async()=>{
  setSync('', sb?'연결하는 중':'이 기기에만 저장');
  try{await refresh(0);}catch(e){console.error(e);setSync('err','Supabase 연결 실패, 기본 일정 표시');sb=null;await refresh(0);}
  if(sb){
    setSync('live','실시간 공유 중');
    let t=0;const later=()=>{clearTimeout(t);t=setTimeout(()=>refresh(null).catch(()=>setSync('err','새로고침 실패')),250);};
    sb.channel('stops-'+TRIP).on('postgres_changes',{event:'*',schema:'public',table:'xmas_stops'},later)
      .subscribe(st=>{if(st==='SUBSCRIBED')setSync('live','실시간 공유 중');else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT')setSync('err','실시간 연결 끊김');});
  }
  setPlay(true);
  if(!renderer)return;
  S.overview=true;$('#over').classList.add('on');
  setTimeout(()=>{S.overview=false;$('#over').classList.remove('on');lastMode=null;fly=null;},1300);
  requestAnimationFrame(tick);
})();
})();
</script>
